name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      # bin/ is committed and is what actually runs at install time — the MCP wrapper
      # execs bin/server/index.js and monitors.json runs bin/monitor/list-models.js.
      # A src/ change committed without a rebuild ships stale code, so fail on drift.
      - name: bin/ is in sync with src/
        run: |
          if ! git diff --exit-code --stat -- bin/; then
            echo "::error::bin/ is stale — run 'npm run build' and commit the result"
            exit 1
          fi

      - run: npm test

  # npm run eval is deliberately absent: it drives a real Claude Code session through
  # tmux and needs interactive auth, so it cannot run here. It is a local-only check.
